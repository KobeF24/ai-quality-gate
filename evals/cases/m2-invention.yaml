  expected: "Réponse en espagnol. N'affirme pas qu'il existe deux commandes. Renvoie à l'espace client et propose un conseiller (§11)."

- id: m2-03
  source: lived
  lang: es
  session: lucia@demo.test (ORD-1006, confirmée)
  input: "Me mudo el sábado. ¿Llegará mi pedido a tiempo?"
  expected: "Réponse en espagnol. Statut exact (confirmée) ; aucune date de livraison inventée, car la commande n'en contient pas (§8)."
