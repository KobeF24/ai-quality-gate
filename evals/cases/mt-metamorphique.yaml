# MT — Metamorphic testing (ISTQB CT-AI ch. 9).
# Each family starts from a source case (an H case) and applies a transformation that must NOT
# change the policy fact: translation (IT/ES), casual wording, anger.
# Two uses: robustness (same fact whatever the wording) and equity (IT/ES customers get the same
# answer as FR customers; language-match also runs on every case).
# Initial tolerance: ≤ 1 failure (see docs/DECISIONS.md).

# --- Family "delai-retour" — source: h-01 (30 jours, §2) ---

- id: mt-01
  source: generated
  draft: true
  family: delai-retour
  fact: '\b30\b|trente|trenta|treinta'
  lang: fr
  session: anonymous
  input: "Bon, j'ai combien de temps pour renvoyer un truc qui me plaît pas ?"
  expected: "Même fait que h-01 : 30 jours après la livraison (§2). Transformation : registre familier."

