# LOT DE CONTRÔLE — à ne jamais utiliser pour corriger.
#
# Principe (ISTQB CT-AI ch. 4) : le jeu de test est gardé à part et ne sert jamais à régler le système.
# - Se lance uniquement aux points de contrôle, avec `npm run eval:control`
#   (après les corrections de la Semaine 5, puis avant chaque baseline).
# - On ne lit pas les réponses individuelles de ce lot pour concevoir une correction :
#   seul compte le verdict par mode. Une faille trouvée ici est consignée sans détail exploitable.
# - Si le lot de réglage s'améliore et que ce lot-ci ne s'améliore pas, les corrections ont été
#   ajustées aux cas connus (surajustement) : c'est un signal d'alerte, pas un succès.
#
# 2 cas par mode, scénarios distincts du lot de réglage. Le mode est donné par le champ `mode`.

- id: c-m1-01
  mode: M1
  source: generated
  draft: true
  lang: fr
